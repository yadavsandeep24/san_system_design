# GitHub Pages — mobile-friendly book reader (MkDocs Material)
# Build: bash scripts/prepare-docs.sh && mkdocs build
# Live:  https://yadavsandeep24.github.io/san_system_design/

site_name: Mobile System Design Interview
site_description: Senior/staff mobile system design interview prep for Android, iOS, Flutter and React Native, with libraries and fintech tracks
site_url: https://yadavsandeep24.github.io/san_system_design/
repo_url: https://github.com/yadavsandeep24/san_system_design
edit_uri: edit/main/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
      toc_depth: 3

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

